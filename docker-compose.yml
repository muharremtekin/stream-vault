version: '3.8'

services:
  # --- Infrastructure ---
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: streamvault_users
      POSTGRES_USER: ${POSTGRES_USER:-streamvault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streamvault"]
      interval: 5s
      timeout: 3s
      retries: 5

  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_DATABASE: streamvault_catalog
    ports: ["27017:27017"]
    volumes:
      - mongo_data:/data/db
      - ./infrastructure/mongo/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes:
      - ./infrastructure/redis/redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  consul:
    image: hashicorp/consul:1.17
    ports:
      - "8500:8500"     # UI
      - "8600:8600/udp" # DNS
    command: agent -server -bootstrap-expect=1 -ui -client=0.0.0.0
    volumes:
      - consul_data:/consul/data

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-streamvault}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-secret}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./infrastructure/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf
      - ./infrastructure/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"     # API
      - "9001:9001"     # Console
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - ./infrastructure/minio/init-buckets.sh:/init-buckets.sh
    entrypoint: ["/bin/sh", "/init-buckets.sh"]
    restart: "no"

  # --- Application Services ---
  gateway:
    build: ./gateway
    ports: ["8081:8080"]
    environment:
      - GATEWAY_JWT_SECRET=${JWT_SECRET:-StreamVault-Super-Secret-Key-Change-In-Production-Min-32-Chars!}
      - GATEWAY_CONSUL_ADDRESS=consul:8500
      - GATEWAY_RATELIMIT_REDIS_URL=redis://redis:6379/0
    depends_on:
      consul:
        condition: service_started
      redis:
        condition: service_healthy

  user-service:
    build: ./services/user-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=streamvault_users;Username=${POSTGRES_USER:-streamvault};Password=${POSTGRES_PASSWORD:-secret}
      - Jwt__Secret=${JWT_SECRET:-StreamVault-Super-Secret-Key-Change-In-Production-Min-32-Chars!}
      - Jwt__Issuer=StreamVault.UserService
      - Jwt__AccessTokenExpirationMinutes=60
      - Jwt__RefreshTokenExpirationDays=30
      - Consul__Address=http://consul:8500
      - ServiceRegistration__Name=user-service
      - ServiceRegistration__Port=8080
      - Service__Host=user-service
    depends_on:
      postgres:
        condition: service_healthy
      consul:
        condition: service_started

  catalog-service:
    build: ./services/catalog-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - MongoDB__ConnectionString=mongodb://mongo:27017
      - MongoDB__DatabaseName=streamvault_catalog
      - Consul__Address=http://consul:8500
      - ServiceRegistration__Name=catalog-service
      - ServiceRegistration__Port=5100
      - Service__Host=catalog-service
      - Service__Port=5100
    depends_on:
      mongo:
        condition: service_healthy
      consul:
        condition: service_started

volumes:
  postgres_data:
  mongo_data:
  consul_data:
  rabbitmq_data:
  minio_data:
