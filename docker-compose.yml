version: '3.8'

services:
  # --- Infrastructure ---
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: streamvault_users
      POSTGRES_USER: ${POSTGRES_USER:-streamvault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sh:/docker-entrypoint-initdb.d/10-streamvault-init.sh:ro
      - ./infrastructure/postgres/init.sql:/opt/streamvault/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ${CATALOG_DATABASE_NAME:-streamvault_catalog}
    ports: ["27017:27017"]
    volumes:
      - mongo_data:/data/db
      - ./infrastructure/mongo/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js
    command: mongod --wiredTigerCacheSizeGB 0.25
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports: ["6379:6379"]
    volumes:
      - ./infrastructure/redis/redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 192M

  consul:
    image: hashicorp/consul:1.17
    restart: unless-stopped
    ports:
      - "8500:8500"     # UI
      - "8600:8600/udp" # DNS
    command: agent -server -bootstrap-expect=1 -ui -client=0.0.0.0
    volumes:
      - ./infrastructure/consul/server.hcl:/consul/config/server.hcl:ro
      - consul_data:/consul/data
    healthcheck:
      test: ["CMD", "consul", "members", "-status=alive"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-streamvault}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./infrastructure/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 384M

  rabbitmq-init:
    image: curlimages/curl:8.5.0
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_USER: ${RABBITMQ_USER:-streamvault}
      RABBITMQ_PASS: ${RABBITMQ_PASS}
    configs:
      - source: rabbitmq_definitions
        target: /definitions.json
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        test -n "$${RABBITMQ_USER}" &&
        test -n "$${RABBITMQ_PASS}" &&
        curl --fail --silent --show-error
        --retry 20 --retry-delay 1 --retry-connrefused
        --user "$${RABBITMQ_USER}:$${RABBITMQ_PASS}"
        --header "content-type: application/json"
        --data-binary @/definitions.json
        http://rabbitmq:15672/api/definitions
    restart: "no"

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    ports:
      - "9000:9000"     # API
      - "9001:9001"     # Console
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - ./infrastructure/minio/init-buckets.sh:/init-buckets.sh
    entrypoint: ["/bin/sh", "/init-buckets.sh"]
    restart: "no"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms256m -Xmx256m"
    ports: ["9200:9200"]
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    profiles:
      - elasticsearch

  elasticsearch-init:
    image: curlimages/curl:8.5.0
    depends_on:
      elasticsearch:
        condition: service_healthy
    volumes:
      - ./infrastructure/elasticsearch/init-index.sh:/init-index.sh:ro
    entrypoint: ["/bin/sh", "/init-index.sh"]
    restart: "no"
    profiles:
      - elasticsearch

  # --- Application Services ---
  gateway:
    build: ./gateway
    restart: unless-stopped
    ports: ["8081:8080"]
    environment:
      - GATEWAY_JWT_SECRET=${JWT_SECRET}
      - GATEWAY_CONSUL_ADDRESS=consul:8500
      - GATEWAY_RATELIMIT_REDIS_URL=redis://redis:6379/0
      - GATEWAY_OTEL_ENDPOINT=jaeger:4317
      - GATEWAY_USER_SERVICE_URL=http://user-service:${USER_SERVICE_PORT:-8080}
      - GATEWAY_CATALOG_SERVICE_URL=http://catalog-service:${CATALOG_SERVICE_PORT:-5100}
      - GATEWAY_SUBSCRIPTION_SERVICE_URL=http://subscription-service:${SUBSCRIPTION_SERVICE_PORT:-5007}
    depends_on:
      consul:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health/live"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  user-service:
    build: ./services/user-service
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:${USER_SERVICE_PORT:-8080}
      - SERVICE_PORT=${USER_SERVICE_PORT:-8080}
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=streamvault_users;Username=${POSTGRES_USER:-streamvault};Password=${POSTGRES_PASSWORD}
      - Jwt__Secret=${JWT_SECRET}
      - Jwt__Issuer=StreamVault.UserService
      - Jwt__ExpiresInMinutes=${JWT_EXPIRES_IN_MINUTES:-60}
      - Jwt__RefreshTokenExpirationDays=30
      - Consul__Address=http://consul:8500
      - ServiceRegistration__Name=${USER_SERVICE_NAME:-user-service}
      - ServiceRegistration__Port=${USER_SERVICE_PORT:-8080}
      - Service__Host=user-service
      - RabbitMQ__ConnectionString=amqp://${RABBITMQ_USER:-streamvault}:${RABBITMQ_PASS}@rabbitmq:5672/
      - OpenTelemetry__Endpoint=http://jaeger:4317
    depends_on:
      postgres:
        condition: service_healthy
      consul:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      rabbitmq-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://localhost:$${SERVICE_PORT}/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  catalog-service:
    build: ./services/catalog-service
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:${CATALOG_SERVICE_PORT:-5100}
      - SERVICE_PORT=${CATALOG_SERVICE_PORT:-5100}
      - MongoDB__ConnectionString=mongodb://mongo:27017
      - MongoDB__DatabaseName=${CATALOG_DATABASE_NAME:-streamvault_catalog}
      - Consul__Address=http://consul:8500
      - ServiceRegistration__Name=${CATALOG_SERVICE_NAME:-catalog-service}
      - ServiceRegistration__Port=${CATALOG_SERVICE_PORT:-5100}
      - Service__Host=catalog-service
      - RabbitMQ__ConnectionString=amqp://${RABBITMQ_USER:-streamvault}:${RABBITMQ_PASS}@rabbitmq:5672/
      - RabbitMQ__QueueName=encoding.results.catalog
      - OpenTelemetry__Endpoint=http://jaeger:4317
    depends_on:
      mongo:
        condition: service_healthy
      consul:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      rabbitmq-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://localhost:$${SERVICE_PORT}/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  streaming-service:
    build:
      context: .
      dockerfile: services/streaming-service/Dockerfile
    restart: unless-stopped
    environment:
      - STREAMING_CONSUL_ADDRESS=consul:8500
      - STREAMING_MINIO_ENDPOINT=minio:9000
      - STREAMING_MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - STREAMING_MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - STREAMING_REDIS_URL=redis://redis:6379/0
      - STREAMING_RABBITMQ_URL=amqp://${RABBITMQ_USER:-streamvault}:${RABBITMQ_PASS}@rabbitmq:5672/
      - STREAMING_OTEL_ENDPOINT=jaeger:4317
    depends_on:
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      rabbitmq-init:
        condition: service_completed_successfully
      consul:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5003/health/live"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  encoding-service:
    build:
      context: .
      dockerfile: services/encoding-service/Dockerfile
    restart: unless-stopped
    environment:
      - ENCODING_CONSUL__ADDRESS=consul:8500
      - ENCODING_MINIO__ENDPOINT=minio:9000
      - ENCODING_MINIO__ACCESS_KEY=${MINIO_ACCESS_KEY}
      - ENCODING_MINIO__SECRET_KEY=${MINIO_SECRET_KEY}
      - ENCODING_RABBITMQ__URL=amqp://${RABBITMQ_USER:-streamvault}:${RABBITMQ_PASS}@rabbitmq:5672/%2f
      - ENCODING_RABBITMQ__MAX_RETRIES=${ENCODING_MAX_RETRIES:-3}
      - ENCODING_REDIS__URL=redis://redis:6379/1
      - ENCODING_ENCODING__MAX_CONCURRENT_JOBS=${ENCODING_MAX_CONCURRENT_JOBS:-2}
      - ENCODING_TELEMETRY__ENDPOINT=http://jaeger:4318
    depends_on:
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      rabbitmq-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      consul:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5004/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "3.0"
          memory: 3G

  # --- Phase 3 Services ---

  search-service:
    build: ./services/search-service
    restart: unless-stopped
    environment:
      - SEARCH_ELASTICSEARCH_URL=http://elasticsearch:9200
      - SEARCH_RABBITMQ_URL=amqp://${RABBITMQ_USER:-streamvault}:${RABBITMQ_PASS}@rabbitmq:5672/
      - SEARCH_REDIS_URL=redis://redis:6379/3
      - SEARCH_CONSUL_ADDRESS=consul:8500
      - SEARCH_OTEL_ENDPOINT=jaeger:4317
    depends_on:
      elasticsearch:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      rabbitmq-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      consul:
        condition: service_healthy
      elasticsearch-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5005/health/live"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
    profiles:
      - elasticsearch

  recommendation-service:
    build: ./services/recommendation-service
    restart: unless-stopped
    environment:
      - RECOMMENDATION_POSTGRES_URL=postgres://${POSTGRES_USER:-streamvault}:${POSTGRES_PASSWORD}@postgres:5432/streamvault_recommendations
      - RECOMMENDATION_RABBITMQ_URL=amqp://${RABBITMQ_USER:-streamvault}:${RABBITMQ_PASS}@rabbitmq:5672/
      - RECOMMENDATION_REDIS_URL=redis://redis:6379/4
      - RECOMMENDATION_CONSUL_ADDRESS=consul:8500
      - RECOMMENDATION_OTEL_ENDPOINT=jaeger:4317
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      rabbitmq-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      consul:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5006/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  subscription-service:
    build: ./services/subscription-service
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:${SUBSCRIPTION_SERVICE_PORT:-5007}
      - SERVICE_PORT=${SUBSCRIPTION_SERVICE_PORT:-5007}
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=streamvault_subscriptions;Username=${POSTGRES_USER:-streamvault};Password=${POSTGRES_PASSWORD}
      - RabbitMQ__ConnectionString=amqp://${RABBITMQ_USER:-streamvault}:${RABBITMQ_PASS}@rabbitmq:5672/
      - Consul__Address=http://consul:8500
      - ServiceRegistration__Name=${SUBSCRIPTION_SERVICE_NAME:-subscription-service}
      - ServiceRegistration__Port=${SUBSCRIPTION_SERVICE_PORT:-5007}
      - Service__Host=subscription-service
      - OpenTelemetry__Endpoint=http://jaeger:4317
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      rabbitmq-init:
        condition: service_completed_successfully
      consul:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://localhost:$${SERVICE_PORT}/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  notification-service:
    build: ./services/notification-service
    restart: unless-stopped
    environment:
      - NOTIFICATION_MONGODB_URI=mongodb://mongo:27017
      - NOTIFICATION_MONGODB_DATABASE=streamvault_notifications
      - NOTIFICATION_RABBITMQ_URL=amqp://${RABBITMQ_USER:-streamvault}:${RABBITMQ_PASS}@rabbitmq:5672/
      - NOTIFICATION_CONSUL_ADDRESS=consul:8500
      - NOTIFICATION_JWT_SECRET=${JWT_SECRET}
      - NOTIFICATION_OTEL_ENDPOINT=jaeger:4317
    depends_on:
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      rabbitmq-init:
        condition: service_completed_successfully
      consul:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5008/health/live"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  # --- Frontend ---
  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8081}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8081}
    restart: unless-stopped
    ports: ["3001:3001"]
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8081}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-ws://localhost:8081}
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3001"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  # --- Observability ---

  jaeger:
    image: jaegertracing/all-in-one:1.54
    restart: unless-stopped
    ports:
      - "16686:16686"   # UI
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - SPAN_STORAGE_TYPE=badger
      - BADGER_EPHEMERAL=true
      - BADGER_DIRECTORY_VALUE=/badger/data
      - BADGER_DIRECTORY_KEY=/badger/key
    volumes:
      - ./observability/jaeger/jaeger-config.yml:/etc/jaeger/config.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://localhost:16686/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    profiles:
      - observability

  prometheus:
    image: prom/prometheus:v2.50.0
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    profiles:
      - observability

  loki:
    image: grafana/loki:3.0.0
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml
    ports:
      - "3100:3100"
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
    profiles:
      - observability

  promtail:
    image: grafana/promtail:3.0.0
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./observability/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      loki:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo -e \"GET /ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" > /dev/tcp/localhost/9080'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.15"
          memory: 128M
    profiles:
      - observability

  grafana:
    image: grafana/grafana:10.3.0
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-streamvault}
    volumes:
      - ./observability/grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
      jaeger:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
    profiles:
      - observability

volumes:
  postgres_data:
  mongo_data:
  consul_data:
  rabbitmq_data:
  minio_data:
  elasticsearch_data:
  prometheus_data:
  grafana_data:
  loki_data:

configs:
  rabbitmq_definitions:
    file: ./infrastructure/rabbitmq/definitions.json
