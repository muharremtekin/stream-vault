server:
  port: 8080
  read_timeout: 300s
  write_timeout: 300s

jwt:
  secret: ""
  issuer: "StreamVault.UserService"

ratelimit:
  requests_per_second: 100
  burst: 200
  redis_url: "redis://redis:6379/0"

consul:
  address: "consul:8500"
  health_check_interval: 10s

services:
  user-service:
    url: "http://user-service:8080"
    health_path: "/health/ready"
  catalog-service:
    url: "http://catalog-service:5100"
    health_path: "/health/ready"
  streaming-service:
    url: "http://streaming-service:5003"
    health_path: "/health/ready"
  encoding-service:
    url: "http://encoding-service:5004"
    health_path: "/health/ready"
  search-service:
    url: "http://search-service:5005"
    health_path: "/health/ready"
  recommendation-service:
    url: "http://recommendation-service:5006"
    health_path: "/health/ready"
  subscription-service:
    url: "http://subscription-service:5007"
    health_path: "/health/ready"
  notification-service:
    url: "http://notification-service:5008"
    health_path: "/health/ready"

resilience:
  circuit_breaker:
    failure_threshold: 5
    success_threshold: 3
    timeout: 30s
  retry:
    max_retries: 3
    initial_backoff: 100ms
    max_backoff: 2s
    multiplier: 2.0
    jitter_fraction: 0.2
  default_timeout: 5s
  default_max_concurrent: 30
  services:
    user-service:
      timeout: 5s
      max_concurrent: 50
    catalog-service:
      timeout: 5s
      max_concurrent: 50
    streaming-service:
      timeout: 60s
      max_concurrent: 200
    search-service:
      timeout: 5s
      max_concurrent: 100
    encoding-service:
      timeout: 5s
      max_concurrent: 30
    recommendation-service:
      timeout: 5s
      max_concurrent: 30
    subscription-service:
      timeout: 5s
      max_concurrent: 30
    notification-service:
      timeout: 5s
      max_concurrent: 30

logging:
  level: "info"
  format: "json"

otel:
  enabled: true
  endpoint: "jaeger:4317"
  service_name: "gateway"
  insecure: true
