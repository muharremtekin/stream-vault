server:
  port: 8080
  read_timeout: 300s
  write_timeout: 300s

jwt:
  secret: ""
  issuer: "StreamVault.UserService"

ratelimit:
  requests_per_second: 100
  burst: 200
  redis_url: "redis://redis:6379/0"

consul:
  address: "consul:8500"
  health_check_interval: 10s

services:
  user-service:
    url: "http://user-service:8080"
    health_path: "/health/ready"
  catalog-service:
    url: "http://catalog-service:5100"
    health_path: "/health/ready"
  streaming-service:
    url: "http://streaming-service:5003"
    health_path: "/health/ready"
  encoding-service:
    url: "http://encoding-service:5004"
    health_path: "/health/ready"
  search-service:
    url: "http://search-service:5005"
    health_path: "/health/ready"
  recommendation-service:
    url: "http://recommendation-service:5006"
    health_path: "/health/ready"
  subscription-service:
    url: "http://subscription-service:5007"
    health_path: "/health/ready"
  notification-service:
    url: "http://notification-service:5008"
    health_path: "/health/ready"

logging:
  level: "info"
  format: "json"

otel:
  enabled: true
  endpoint: "jaeger:4317"
  service_name: "gateway"
  insecure: true
