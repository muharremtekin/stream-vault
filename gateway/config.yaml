server:
  port: 8080
  read_timeout: 15s
  write_timeout: 15s

jwt:
  secret: ""
  issuer: "StreamVault.UserService"

ratelimit:
  requests_per_second: 100
  burst: 200
  redis_url: "redis://redis:6379/0"

consul:
  address: "consul:8500"
  health_check_interval: 10s

services:
  user-service:
    url: "http://user-service:8080"
    health_path: "/health/ready"
  catalog-service:
    url: "http://catalog-service:5100"
    health_path: "/health/ready"
  streaming-service:
    url: "http://streaming-service:5003"
    health_path: "/health/ready"

logging:
  level: "info"
  format: "json"
