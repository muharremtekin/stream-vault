[server]
http_port = 3000
root_url = http://localhost:3000

[security]
admin_user = admin

[auth.anonymous]
enabled = false

[analytics]
reporting_enabled = false
check_for_updates = false

[log]
mode = console
level = info

[paths]
provisioning = /etc/grafana/provisioning

[users]
allow_sign_up = false
