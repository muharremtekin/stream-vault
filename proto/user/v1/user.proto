syntax = "proto3";

package user.v1;

option go_package = "github.com/streamvault/proto/user/v1;userv1";
option csharp_namespace = "StreamVault.Proto.User.V1";

service UserService {
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
  rpc ValidateToken(ValidateTokenRequest) returns (ValidateTokenResponse);
}

message GetUserRequest {
  string user_id = 1;
}

message GetUserResponse {
  string id = 1;
  string email = 2;
  string role = 3;
  int32 profile_count = 4;
}

message ValidateTokenRequest {
  string token = 1;
}

message ValidateTokenResponse {
  bool valid = 1;
  string user_id = 2;
  string role = 3;
}
