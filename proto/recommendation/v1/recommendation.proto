syntax = "proto3";

package recommendation.v1;

option go_package = "github.com/streamvault/gateway/proto/recommendation/v1;recommendationv1";
option csharp_namespace = "StreamVault.Proto.Recommendation.V1";

import "common/v1/common.proto";

// RecommendationService provides personalized recommendations,
// similar content discovery, and home page sections.
service RecommendationService {
  // GetRecommendations returns personalized content recommendations for a user.
  rpc GetRecommendations(GetRecommendationsRequest) returns (GetRecommendationsResponse);

  // GetSimilar returns content similar to a given content item.
  rpc GetSimilar(GetSimilarRequest) returns (GetSimilarResponse);

  // GetHomePageSections returns curated sections for the user's home page.
  rpc GetHomePageSections(GetHomePageSectionsRequest) returns (GetHomePageSectionsResponse);
}

// --- Enums ---

// SectionType defines the kind of home page section.
enum SectionType {
  SECTION_TYPE_UNSPECIFIED = 0;
  SECTION_TYPE_PERSONAL = 1;
  SECTION_TYPE_TRENDING = 2;
  SECTION_TYPE_BECAUSE_YOU_WATCHED = 3;
  SECTION_TYPE_GENRE = 4;
  SECTION_TYPE_NEW = 5;
}

// --- GetRecommendations ---

message GetRecommendationsRequest {
  string user_id = 1;
  int32 limit = 2;                                    // Max items; 0 = server default (20)
}

message GetRecommendationsResponse {
  repeated RecommendedItem items = 1;
}

message RecommendedItem {
  string content_id = 1;
  string title = 2;
  string thumbnail_url = 3;
  common.v1.ContentType content_type = 4;
  int32 release_year = 5;
  double average_rating = 6;
  double score = 7;                                   // Recommendation score (0.0 - 1.0)
  string algorithm = 8;                               // "hybrid", "collaborative", "content_based", "popularity"
  string reason = 9;                                  // Human-readable reason, e.g. "Because you watched Interstellar"
}

// --- GetSimilar ---

message GetSimilarRequest {
  string content_id = 1;
  int32 limit = 2;                                    // Max items; 0 = server default (10)
}

message GetSimilarResponse {
  repeated SimilarItem items = 1;
}

message SimilarItem {
  string content_id = 1;
  string title = 2;
  string thumbnail_url = 3;
  common.v1.ContentType content_type = 4;
  int32 release_year = 5;
  double average_rating = 6;
  double similarity_score = 7;                        // Cosine similarity (0.0 - 1.0)
}

// --- GetHomePageSections ---

message GetHomePageSectionsRequest {
  string user_id = 1;
}

message GetHomePageSectionsResponse {
  repeated HomePageSection sections = 1;
}

message HomePageSection {
  SectionType section_type = 1;
  string title = 2;                                   // Display title, e.g. "Because you watched Inception"
  repeated RecommendedItem items = 3;
}
