# StreamVault RabbitMQ Configuration

# Load topology definitions on startup (users must be included — load_definitions skips env var defaults)
load_definitions = /etc/rabbitmq/definitions.json

# Logging
log.console = true
log.console.level = info

# Default virtual host
default_vhost = /

# Memory high watermark (absolute value matching Docker container limit)
# Using absolute instead of relative prevents alarm flip-flop in containers
# where RabbitMQ sees host RAM but is limited by cgroup
vm_memory_high_watermark.absolute = 200MB

# Consumer timeout (30 minutes - encoding jobs can be long-running)
consumer_timeout = 1800000
