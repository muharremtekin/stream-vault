version: '3.8'

# Local development overrides
services:
  gateway:
    environment:
      - GATEWAY_LOGGING_LEVEL=debug

  user-service:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    ports:
      - "5001:8080"

  catalog-service:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    ports:
      - "5002:5100"

  streaming-service:
    environment:
      - STREAMING_LOGGING_LEVEL=debug
    ports:
      - "5003:5003"
      - "50051:50051"

  encoding-service:
    environment:
      - ENCODING_LOGGING__LEVEL=debug
      - ENCODING_LOGGING__FORMAT=pretty
    ports:
      - "5004:5004"
      - "50052:50052"

  # --- Phase 3 Services ---

  search-service:
    environment:
      - SEARCH_LOGGING_LEVEL=debug
    ports:
      - "5005:5005"
      - "50053:50053"

  recommendation-service:
    environment:
      - RECOMMENDATION_LOGGING_LEVEL=debug
    ports:
      - "5006:5006"
      - "50054:50054"

  subscription-service:
    ports:
      - "5007:5007"

  notification-service:
    environment:
      - NOTIFICATION_LOGGING_LEVEL=debug
    ports:
      - "5008:5008"

  # --- Frontend ---
  web:
    ports:
      - "3001:3001"
