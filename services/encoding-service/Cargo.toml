[package]
name = "encoding-service"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "encoding-service"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }

# HTTP framework
axum = "0.8"
tower = { version = "0.5", features = ["timeout", "util"] }
tower-http = { version = "0.6", features = ["trace"] }

# gRPC
tonic = "0.12"
prost = "0.13"
prost-types = "0.13"

# RabbitMQ
lapin = "2.5"
futures-lite = "2"

# S3 / MinIO
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1"
aws-credential-types = "1"
aws-smithy-types = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Configuration
config = "0.14"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["json"] }
bytes = "1"
futures = "0.3"
async-trait = "0.1"

[dev-dependencies]
http-body-util = "0.1"

[build-dependencies]
tonic-build = "0.12"

[profile.release]
strip = true
lto = "thin"
