[server]
http_port = 5004
grpc_port = 50052

[consul]
address = "localhost:8500"
service_name = "encoding-service"
health_check_interval_secs = 10

[minio]
endpoint = "localhost:9000"
access_key = ""
secret_key = ""
use_ssl = false
raw_bucket = "streamvault-raw"
encoded_bucket = "streamvault-encoded"
thumbnails_bucket = "streamvault-thumbnails"
region = "us-east-1"

[rabbitmq]
url = "amqp://localhost:5672/%2f"
jobs_queue = "encoding.jobs"
exchange = "encoding"
completed_routing_key = "job.completed"
failed_routing_key = "job.failed"
# The consumer raises this to max_concurrent_jobs when necessary.
prefetch = 2
# Number of retries after the initial attempt. 0 means exactly one attempt.
max_retries = 3
retry_delay_secs = 5

[redis]
url = "redis://localhost:6379/1"

[encoding]
temp_dir = "/tmp/encoding"
ffmpeg_path = "/usr/bin/ffmpeg"
ffprobe_path = "/usr/bin/ffprobe"
# Maximum number of encoding pipelines allowed to run at once (must be >= 1).
max_concurrent_jobs = 2

[logging]
level = "info"
format = "json"

[telemetry]
enabled = true
endpoint = "http://localhost:4318"
service_name = "encoding-service"
insecure = true
